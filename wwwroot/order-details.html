<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order Details | StrideX Sports</title>
<link rel="stylesheet" href="css/style.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{width:min(1080px,calc(100% - 32px));margin:42px auto 70px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
.top h1{margin:0 0 7px}.muted{color:#666;margin:0}
.status{padding:8px 13px;border-radius:999px;background:#ede4ff;color:#6d28d9;font-weight:800;font-size:13px}
.panel{background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.panel h2{margin:0 0 18px;font-size:20px}
.tracker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.step{text-align:center;position:relative}.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;background:#e8e8ec;color:#777;font-weight:900}.step.active .dot,.step.done .dot{background:#7c3aed;color:#fff}.step span{font-size:12px;color:#666;font-weight:700}.step.active span,.step.done span{color:#4c1d95}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.info{padding:14px;background:#fafafa;border:1px solid #ececf0;border-radius:10px}.info span{display:block;color:#777;font-size:11px;text-transform:uppercase;margin-bottom:5px}
.item{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.item img{width:80px;height:80px;object-fit:contain;border:1px solid #eee;border-radius:9px;padding:5px}.item h3{margin:0 0 6px;font-size:16px}.item p{margin:3px 0;color:#666;font-size:13px}.price{font-weight:900;color:#7c3aed}
.total{display:flex;justify-content:space-between;gap:20px;font-size:21px;font-weight:900;margin-top:18px;padding-top:16px;border-top:2px solid #111}.total strong{color:#7c3aed}
.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:12px 17px;border-radius:8px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:800}.btn.secondary{background:#111}
.message{padding:15px;background:#eee;border-radius:10px}.message.error{background:#fde8eb;color:#a12638}
[hidden]{display:none!important}
@media(max-width:700px){.top{flex-direction:column}.tracker{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.item{grid-template-columns:65px 1fr}.item img{width:65px;height:65px}.price{grid-column:2}}
.automation-topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 5%;background:#111018;color:#fff}.automation-brand{color:#fff;text-decoration:none;font-size:22px;font-weight:900}.automation-brand span{color:#9b5cff}.automation-topbar .header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.automation-topbar .header-action{color:#fff;text-decoration:none}.btn{border:0;cursor:pointer;font:inherit}
</style>
</head>
<body>
<header class="automation-topbar"><a class="automation-brand" href="index.html">Stride<span>X</span> Sports</a><div class="header-actions"><a href="cart.html" class="header-action cart-action"><span>Cart</span><span class="cart-count">0</span></a></div></header>
<main class="page">
<div id="message" class="message">Loading order details...</div>
<div id="content" hidden>
<div class="top"><div><h1 id="title">Order Details</h1><p id="date" class="muted"></p></div><span id="status" class="status"></span></div>

<section class="panel">
<h2>Order Tracking</h2>
<div id="tracker" class="tracker"></div>
</section>

<section class="panel">
<h2>Fulfilment & Payment</h2>
<div class="grid">
<div class="info"><span>Customer</span><strong id="customer"></strong></div>
<div class="info"><span>Phone</span><strong id="phone"></strong></div>
<div class="info"><span>Payment</span><strong id="payment"></strong></div>
<div class="info"><span>Fulfilment</span><strong id="fulfilment"></strong></div>
<div class="info"><span>Fulfilment Fee</span><strong id="fulfilmentFee"></strong></div>
<div class="info"><span>Street Address</span><strong id="street"></strong></div>
<div class="info"><span>City / Town</span><strong id="city"></strong></div>
<div class="info"><span>Province / Postal</span><strong id="province"></strong></div>
</div>
</section>

<section class="panel">
<h2>Items</h2>
<div id="items"></div>
<div class="total"><span>Total</span><strong id="total"></strong></div>
</section>

<div class="actions">
<button id="reorderButton" class="btn" type="button" hidden>Reorder</button>
<a id="receipt" class="btn" href="#">View Receipt</a>
<a class="btn secondary" href="my-orders.html">Back to My Orders</a>
</div>
</div>
</main>

<script>
const id=Number(new URLSearchParams(window.location.search).get("id"));
const message=document.getElementById("message");
const content=document.getElementById("content");
const reorderButton=document.getElementById("reorderButton");
const money=v=>"R"+Number(v||0).toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2});
const date=v=>new Date(v).toLocaleString("en-ZA",{day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});

function tracker(status){
    const steps=["Confirmed","Processing","Shipped","Delivered"];
    const normalized=String(status||"Confirmed").toLowerCase();
    let current=steps.findIndex(step=>step.toLowerCase()===normalized);
    if(normalized==="cancelled") current=-1;
    if(current<0 && normalized!=="cancelled") current=0;

    const node=document.getElementById("tracker");
    node.replaceChildren();

    steps.forEach((step,index)=>{
        const box=document.createElement("div");
        box.className="step"+(index<current?" done":index===current?" active":"");
        const dot=document.createElement("div");
        dot.className="dot";
        dot.textContent=index<current?"✓":String(index+1);
        const label=document.createElement("span");
        label.textContent=step;
        box.append(dot,label);
        node.append(box);
    });

    if(normalized==="cancelled"){
        node.innerHTML='<div class="step active"><div class="dot">×</div><span>Cancelled</span></div>';
    }
}

async function load(){
    if(!Number.isInteger(id)||id<1){
        message.classList.add("error");message.textContent="A valid order number was not provided.";return;
    }
    try{
        const r=await fetch("/api/orders/"+id+"/receipt",{credentials:"include"});
        if(r.status===401){window.location.href="account.html?return="+encodeURIComponent("order-details.html?id="+id);return;}
        const o=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(o.message||"Could not load this order.");

        document.getElementById("title").textContent="Order #"+o.orderId;
        document.getElementById("date").textContent=date(o.orderDate);
        document.getElementById("status").textContent=o.status||"Confirmed";
        reorderButton.hidden=String(o.status||"").toLowerCase()!=="delivered";
        document.getElementById("customer").textContent=o.customer?.name||"-";
        document.getElementById("phone").textContent=o.customer?.phone||"-";
        document.getElementById("payment").textContent=(o.payment?.status||"-")+(o.payment?.last4?" • Card ending "+o.payment.last4:"");
        document.getElementById("fulfilment").textContent=o.fulfilment?.method||"Delivery";
        document.getElementById("fulfilmentFee").textContent=Number(o.fulfilment?.fee||0)===0?"FREE":money(o.fulfilment?.fee);
        document.getElementById("street").textContent=o.delivery?.streetAddress||"-";
        document.getElementById("city").textContent=o.delivery?.city||"-";
        document.getElementById("province").textContent=[o.delivery?.province,o.delivery?.postalCode].filter(Boolean).join(" • ")||"-";
        document.getElementById("total").textContent=money(o.total);
        document.getElementById("receipt").href="receipt.html?orderId="+o.orderId;
        tracker(o.status);

        const items=document.getElementById("items");items.replaceChildren();
        (o.items||[]).forEach(item=>{
            const row=document.createElement("div");row.className="item";
            const img=document.createElement("img");img.src=item.image||"";img.alt=item.name||"Product";
            const info=document.createElement("div");
            const h=document.createElement("h3");h.textContent=item.name||"Product";
            const meta=document.createElement("p");meta.textContent="Size: "+(item.size||"-")+" • Qty: "+(item.quantity||0);
            const unit=document.createElement("p");unit.textContent=money(item.unitPrice)+" each";
            info.append(h,meta,unit);
            const price=document.createElement("div");price.className="price";price.textContent=money(item.lineTotal);
            row.append(img,info,price);items.append(row);
        });

        message.hidden=true;content.hidden=false;
    }catch(e){message.classList.add("error");message.textContent=e.message||"Could not load this order.";}
}
reorderButton.addEventListener("click",async function(){
    reorderButton.disabled=true;
    reorderButton.textContent="Adding to Cart...";

    try{
        const response=await fetch("/api/orders/"+id+"/reorder",{
            method:"POST",
            credentials:"include"
        });

        const data=await response.json().catch(()=>({}));

        if(!response.ok){
            throw new Error(data.message||"Could not reorder these items.");
        }

        window.location.href="cart.html";
    }catch(error){
        message.hidden=false;
        message.classList.add("error");
        message.textContent=error.message||"Could not reorder these items.";
        reorderButton.disabled=false;
        reorderButton.textContent="Reorder";
    }
});

load();
</script>

<script src="js/site-auth.js?v=header-read-fix-20261007"></script>
</body>
</html>
