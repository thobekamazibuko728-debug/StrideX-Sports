<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Kit Order | StrideX Sports</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f5f5f7; color: #111; font-family: Arial, Helvetica, sans-serif; }
        .kit-order-page { width: min(1100px, calc(100% - 40px)); margin: 44px auto 70px; }
        .kit-order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 26px; }
        .kit-order-top h1 { margin: 0 0 8px; font-size: 34px; }
        .kit-order-top p { margin: 0; color: #666; }
        .status-pill { display: inline-block; padding: 8px 13px; border-radius: 999px; background: #eee; font-size: 13px; font-weight: bold; }
        .status-pending { background: #eee; color: #555; }
        .status-cancelled { background: #fde8eb; color: #a12638; }
        .status-confirmed { background: #ede4ff; color: #6d28d9; }
        .status-paid { background: #e4f8ea; color: #22763c; }
        .status-processing { background: #fff4d8; color: #8a5a00; }
        .status-completed, .status-delivered { background: #e4f8ea; color: #22763c; }
        .panel { background: #fff; border: 1px solid #e3e3e3; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,.05); margin-bottom: 22px; overflow: hidden; }
        .panel h2 { margin: 0; padding: 20px 24px; border-bottom: 1px solid #ececec; font-size: 21px; }
        .details-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 15px; padding: 22px 24px; }
        .detail { padding: 14px; background: #fafafa; border: 1px solid #ececec; border-radius: 10px; }
        .detail span { display: block; margin-bottom: 6px; color: #777; font-size: 12px; text-transform: uppercase; }
        .detail strong { overflow-wrap: anywhere; }
        .colour-row { display: flex; gap: 10px; align-items: center; }
        .swatch { width: 28px; height: 28px; border: 1px solid #ccc; border-radius: 50%; }
        .players-wrap { overflow-x: auto; padding: 0 24px 24px; }
        table { width: 100%; border-collapse: collapse; min-width: 560px; }
        th, td { padding: 13px 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #fafafa; font-size: 13px; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; padding: 20px 24px; border-top: 1px solid #ececec; background: #fafafa; }
        .btn { display: inline-block; padding: 12px 19px; border: 0; border-radius: 8px; background: #7c3aed; color: #fff; text-decoration: none; font-weight: bold; cursor: pointer; font: inherit; }
        .btn.secondary { background: #111; }
        .btn.danger { background: #b42318; }
        .message { padding: 16px; border-radius: 9px; background: #f0f0f0; color: #555; }
        .message.error { background: #fff0f2; color: #9d2638; border: 1px solid #f1b6bd; }
        [hidden] { display: none !important; }
        @media (max-width: 760px) { .details-grid { grid-template-columns: 1fr; } .kit-order-top { flex-direction: column; } }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-top">
            <div class="logo"><a href="index.html"><img src="images/stridex-logo.jpeg" alt="StrideX Sports Logo"></a></div>
            <form class="header-search" action="shop.xhtml" method="get">
                <input type="text" name="search" placeholder="Search products, brands or sports...">
                <button type="submit">Search</button>
            </form>
            <div class="header-actions">
                <a href="account.html" class="header-action"><span class="action-icon">&#128100;</span><span>Account</span></a>
                <a href="orders.html" class="header-action"><span class="action-icon">&#128230;</span><span>My Orders</span></a>
                <a href="cart.html" class="header-action cart-action"><span class="action-icon">&#128722;</span><span>Cart</span><span class="cart-count" id="headerCartCount">0</span></a>
            </div>
        </div>
        <nav class="main-nav">
            <a href="index.html">Home</a><a href="shop.xhtml">Shop</a><a href="shop.xhtml?sport=soccer">Soccer</a><a href="shop.xhtml?sport=rugby">Rugby</a><a href="shop.xhtml?sport=tennis">Tennis</a><a href="shop.xhtml?sport=cycling">Cycling</a><a href="custom-kit.xhtml">Custom Kit</a>
        </nav>
    </header>

    <main class="kit-order-page">
        <div id="pageMessage" class="message">Loading custom kit order...</div>
        <div id="orderContent" hidden>
            <div class="kit-order-top">
                <div><h1 id="pageTitle">Custom Kit Order</h1><p id="orderDate"></p></div>
                <span id="orderStatus" class="status-pill"></span>
            </div>
            <section class="panel">
                <h2>Kit Details</h2>
                <div class="details-grid">
                    <div class="detail"><span>Team</span><strong id="teamName"></strong></div>
                    <div class="detail"><span>Sport</span><strong id="sport"></strong></div>
                    <div class="detail"><span>Garment</span><strong id="garment"></strong></div>
                    <div class="detail"><span>Design</span><strong id="template"></strong></div>
                    <div class="detail"><span>Quantity</span><strong id="quantity"></strong></div>
                    <div class="detail"><span>Price per kit</span><strong id="pricePerKit"></strong></div>
                    <div class="detail"><span>Estimated total</span><strong id="estimatedTotal"></strong></div>
                    <div class="detail"><span>Colours</span><div class="colour-row"><span class="swatch" id="primaryColour"></span><span class="swatch" id="secondaryColour"></span><span class="swatch" id="accentColour"></span></div></div>
                </div>
            </section>
            <section class="panel">
                <h2>Team List</h2>
                <div class="players-wrap"><table><thead><tr><th>#</th><th>Player Name</th><th>Player Number</th><th>Size</th></tr></thead><tbody id="playersBody"></tbody></table></div>
                <div class="actions"><a href="orders.html" class="btn secondary">Back to My Orders</a><a id="receiptButton" href="#" class="btn secondary">View Receipt</a><a id="payButton" href="#" class="btn" hidden>Pay Now</a><a id="editButton" href="#" class="btn secondary" hidden>Edit Request</a><button id="cancelButton" type="button" class="btn danger" hidden>Cancel Request</button></div>
            </section>
        </div>
    </main>

    <script>
        const API_BASE = "";
        const params = new URLSearchParams(window.location.search);
        const orderId = Number(params.get("id"));
        const pageMessage = document.getElementById("pageMessage");
        const orderContent = document.getElementById("orderContent");
        const editButton = document.getElementById("editButton");
        const cancelButton = document.getElementById("cancelButton");
        const receiptButton = document.getElementById("receiptButton");
        const payButton = document.getElementById("payButton");
        receiptButton.href = "custom-kit-receipt.html?id=" + orderId;
        function formatPrice(value){return "R"+Number(value||0).toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2});}
        function formatDate(value){return new Date(value).toLocaleString("en-ZA",{day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});}
        function statusClass(value){return "status-"+String(value||"pending").toLowerCase().replace(/[^a-z0-9]+/g,"-");}
        async function loadCartCount(){try{const response=await fetch(API_BASE+"/api/cart",{credentials:"include"});if(!response.ok)return;const cart=await response.json();document.getElementById("headerCartCount").textContent=cart.itemCount||0;}catch{}}
        async function loadOrder(){
            if(!Number.isInteger(orderId)||orderId<1){pageMessage.classList.add("error");pageMessage.textContent="A valid custom kit order number was not provided.";return;}
            try{
                const response=await fetch(API_BASE+"/api/custom-kits/"+orderId,{credentials:"include"});
                if(response.status===401){window.location.href="account.html?return="+encodeURIComponent("custom-kit-order.html?id="+orderId);return;}
                const order=await response.json().catch(()=>({}));if(!response.ok)throw new Error(order.message||"Could not load this custom kit order.");
                document.getElementById("pageTitle").textContent=(order.teamName||"Team")+" - Kit #"+order.customKitOrderId;document.getElementById("orderDate").textContent=formatDate(order.createdAt);
                const status=document.getElementById("orderStatus");status.textContent=order.status||"Pending";status.className="status-pill "+statusClass(order.status);
                document.getElementById("teamName").textContent=order.teamName||"-";document.getElementById("sport").textContent=order.sport||"-";document.getElementById("garment").textContent=order.garment||"-";document.getElementById("template").textContent=order.template||"-";document.getElementById("quantity").textContent=order.quantity||0;document.getElementById("pricePerKit").textContent=formatPrice(order.pricePerKit);document.getElementById("estimatedTotal").textContent=formatPrice(order.estimatedTotal);
                document.getElementById("primaryColour").style.background=order.primaryColour||"#fff";document.getElementById("secondaryColour").style.background=order.secondaryColour||"#fff";document.getElementById("accentColour").style.background=order.accentColour||"#fff";
                const body=document.getElementById("playersBody");body.replaceChildren();(order.players||[]).forEach((player,index)=>{const row=document.createElement("tr");[index+1,player.playerName||"-",player.playerNumber||"-",player.size||"-"].forEach(value=>{const cell=document.createElement("td");cell.textContent=value;row.appendChild(cell);});body.appendChild(row);});
                payButton.hidden=!order.canPay;if(order.canPay)payButton.href="custom-kit-payment.html?id="+order.customKitOrderId;editButton.hidden=!order.canEdit;if(order.canEdit)editButton.href="custom-kit.xhtml?v=save-edit-20261007-2&editId="+order.customKitOrderId;cancelButton.hidden=!order.canCancel;cancelButton.disabled=false;pageMessage.hidden=true;orderContent.hidden=false;
            }catch(error){pageMessage.hidden=false;pageMessage.classList.add("error");pageMessage.textContent=error.message||"Could not load this custom kit order.";}
        }
        cancelButton.addEventListener("click",async function(){if(!window.confirm("Cancel this custom kit request?"))return;cancelButton.disabled=true;try{const response=await fetch(API_BASE+"/api/custom-kits/"+orderId+"/cancel",{method:"POST",credentials:"include"});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||"Could not cancel this request.");await loadOrder();}catch(error){alert(error.message||"Could not cancel this request.");cancelButton.disabled=false;}});
        loadCartCount();loadOrder();
    </script>
</body>
</html>
